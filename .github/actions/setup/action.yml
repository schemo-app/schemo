name: Setup
description: Set up Go, Task, native dependencies and optional Node.js

inputs:
  frontend:
    description: Install Node.js and enable the npm download cache
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version-file: go.mod
        cache-dependency-path: |
          go.sum
          Taskfile.yml
          .github/actions/setup/action.yml

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      if: inputs.frontend == 'true'
      with:
        node-version-file: .node-version
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install Linux desktop dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

    - name: Install Task
      shell: bash
      run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
