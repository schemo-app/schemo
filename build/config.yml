version: '3'

info:
  companyName: "Yuri Gerassimov"
  productName: "Schemo"
  productIdentifier: "app.schemo"
  description: "A cross-platform API client for building, testing, and sharing HTTP requests."
  copyright: "© 2026, Yuri Gerassimov"
  comments: "Schemo"
  version: "0.0.12"

protocols:
  - scheme: schemo
    description: Schemo Protocol

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: task build DEV=true
      type: blocking
    - cmd: task dev:frontend
      type: background
    - cmd: task run
      type: primary
